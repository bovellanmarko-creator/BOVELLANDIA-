<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bovellandia - Marjonetti Record</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root {
            --vinyl-black: #121212;
            --burgundy: #3d0a0a;
            --gold: #c5a059;
            --bone: #e5e0d8;
        }

        body {
            background-color: #0a0a0a;
            /* Vinyylilevyn uria simuloiva tausta */
            background-image: radial-gradient(circle, transparent 20%, #000 20.5%, #000 21%, transparent 21.5%),
                              radial-gradient(circle, transparent 40%, #000 40.5%, #000 41%, transparent 41.5%);
            background-size: 10px 10px;
            color: var(--bone);
            font-family: 'Playfair Display', serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .record-container {
            position: relative;
            width: 90%;
            max-width: 700px;
            padding: 40px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Ylempi ympyrä (Kansi) */
        .cover-circle {
            width: 350px;
            height: 350px;
            border-radius: 50%;
            border: 8px solid var(--gold);
            background: url('kansi.jpg') no-repeat center center/cover;
            box-shadow: 0 0 50px rgba(0,0,0,0.8), inset 0 0 100px rgba(0,0,0,0.4);
            z-index: 2;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Keskiöreikä */
        .cover-circle::after {
            content: '';
            width: 25px;
            height: 25px;
            background: #000;
            border-radius: 50%;
            border: 2px solid var(--gold);
        }

        /* Alempi ympyrä (Soittolista) */
        .tracklist-circle {
            width: 500px;
            height: 500px;
            background: linear-gradient(145deg, var(--burgundy), #2a0505);
            border-radius: 50%;
            border: 4px solid var(--gold);
            margin-top: -100px; /* Limitys */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
            z-index: 1;
            padding: 40px;
            box-sizing: border-box;
        }

        .tracklist-circle h2 {
            margin-top: 60px;
            font-size: 1.8rem;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .tracks {
            list-style: none;
            padding: 0;
            width: 80%;
            font-family: 'Special+Elite', monospace;
            font-size: 0.9rem;
        }

        .track-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(197, 160, 89, 0.2);
            cursor: pointer;
            transition: color 0.3s;
        }

        .track-item:hover {
            color: var(--gold);
        }

        .play-icon {
            margin-right: 10px;
            font-size: 0.7rem;
        }

        /* Vinyylilevyn ulkoreuna (koriste taustalla) */
        .vinyl-edge {
            position: absolute;
            width: 800px;
            height: 800px;
            border-radius: 50%;
            background: repeating-radial-gradient(
                circle,
                #111 0,
                #111 2px,
                #181818 3px,
                #111 4px
            );
            z-index: 0;
            opacity: 0.5;
            pointer-events: none;
        }

        @media (max-width: 600px) {
            .cover-circle { width: 280px; height: 280px; }
            .tracklist-circle { width: 350px; height: 350px; margin-top: -60px; }
            .tracks { font-size: 0.7rem; }
        }
    </style>
</head>
<body>

    <div class="vinyl-edge"></div>

    <div class="record-container">
        <div class="cover-circle"></div>

        <div class="tracklist-circle">
            <h2>BOVELLANDIA</h2>
            <p style="font-style: italic; color: var(--gold); margin-top: -10px;">Marjonetti</p>
            
            <ul class="tracks">
                <li class="track-item"><span><span class="play-icon">○</span> 1. Terapiaa</span> <span>4:12</span></li>
                <li class="track-item"><span><span class="play-icon">○</span> 2. Täysihoito tarjolla</span> <span>3:45</span></li>
                <li class="track-item"><span><span class="play-icon">○</span> 3. Taikaa</span> <span>5:01</span></li>
                <li class="track-item"><span><span class="play-icon">○</span> 4. Narunpäät</span> <span>3:30</span></li>
                <li class="track-item"><span><span class="play-icon">○</span> 5. Esirippu laskee</span> <span>3:15</span></li>
                <li class="track-item"><span><span class="play-icon">○</span> 6. Karuselli pysähtyy</span> <span>4:58</span></li>
                <li class="track-item"><span><span class="play-icon">○</span> 7. Meikki murtuu</span> <span>4:20</span></li>
                <li class="track-item"><span><span class="play-icon">○</span> 8. Viimeinen kumarrus</span> <span>6:10</span></li>
            </ul>
        </div>
    </div>

</body>
</html>
